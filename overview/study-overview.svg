<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="ov-title ov-desc">
  <title id="ov-title">Study overview</title>
  <desc id="ov-desc">A schematic whole-slide-image tile grid with one viewport is shown at the left. One recorded navigation session (38 steps, 6,178 tiles) is replayed by k6 as 50 to 300 students with coherent or random paths. Original JPEG servers (Cases 1 and 2) send original JPEG tiles to the viewer. Content-aware edge configurations (Cases 3 to 5) collapse background to one shared tile, encode tissue as compact objects, decode them at an edge pool, and send reconstructed JPEG tiles to the viewer. Delivery measurements include request-batch completion time (mean and p95), slide-open p95, bytes per successful tile response, successful tile throughput, and failed tile requests.</desc>
